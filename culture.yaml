# `model:` is a key of the contract's model registry
# (associate/contract/models.json): `worker` (Pi label "bolt"), `senses` or
# `cortex`. Each entry names a lobes ROLE, never a checkpoint id; the local
# lobes gateway (http://localhost:8001/v1) resolves the role to whichever box
# and checkpoint currently serves it, so a lane can move or re-checkpoint
# without touching this file. `worker` is the registry default.
#
# This key does NOT by itself choose the resident's model: pi-acp ignores the
# `model` in ACP session/new and culture never sends session/set_model
# (docs/notes/resident-model-resolution.md). The extension pins the session to
# the registry model on session_start instead (ASSOCIATE_MODEL, else the
# registry default) — only when ASSOCIATE_API_KEY is set; without it no
# associate provider is registered and pi's own default model applies. This key
# is kept equal to the registry default so whoami and the bench config stamp
# report the model the resident is meant to run.
#
# The mesh backend is `acp`: culture spawns `acp_command` and speaks the Agent
# Client Protocol to it. `pi-acp` (npm) bridges ACP stdio to `pi --mode rpc`, so
# the resident runs the same Pi binary and the same `.pi/extensions/associate`
# tool set as a headless `associate run`. Without this key culture_core falls
# back to its default `["opencode", "acp"]` — a different agent entirely.
#
# `backend: acp` also selects the runtime prompt file: culture's
# backend-consistency invariant maps acp -> AGENTS.md, and Pi loads AGENTS.md as
# its context file in preference to CLAUDE.md. AGENTS.colleague.md is retained
# until the ACP path is verified live (plan task t20).
agents:
- suffix: associate
  backend: acp
  acp_command: ["pi-acp"]
  model: worker
